<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>آئو یومه</title>
    <meta name="theme-color" content="#0e1621" />
    <!-- Supabase origin — EVERY boot-path call (functions/v1 mint, auth/v1 token, rest/v1
         RPC) rides this ONE origin, and the mint's first fetch is the app's first network
         call after the bundle. Preconnecting during the HTML parse pays the DNS + TCP +
         TLS handshake off the critical path (measured ~1.3 s of TCP+TLS on that first
         call). `crossorigin` matches the app's anonymous CORS fetch mode — a mismatch
         would open a SECOND connection instead of warming this one. Keep the URL in step
         with src/lib/supabase/client.ts (SUPABASE_URL's fallback: .env is gitignored, so
         the fallback literal is what CI builds against). -->
    <link rel="preconnect" href="https://bburkvhaokdtocyrznyv.supabase.co" crossorigin />
    <!-- brand mark — prevents the default /favicon.ico 404 in the WebView -->
    <link rel="icon" href="/miniapp/assets/aoyume.svg" />
    <style>
      /* anti-FOUC: inline @font-face + background per §2/§9.9 */
      @font-face {
        font-family: 'Modam';
        /* /miniapp/ is replaced by Vite with the configured base (/miniapp/ in prod,
           /<repo>/ on the GitHub Pages mirror) — the font stays same-origin on every host */
        src: url('/miniapp/fonts/modam-fa.woff2') format('woff2');
        font-weight: 100 900;
        font-display: swap;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0e1621;
        color: #a1a1aa;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0e1621;
        z-index: 9999;
      }
      #splash img {
        width: 120px;
        height: 120px;
      }
    </style>
    <!-- ES5 polyfills BEFORE app scripts (§2/§9.3 [QC4]/[QC8]) — Chromium 70 floor -->
    <script>
      if (!window.queueMicrotask)
        window.queueMicrotask = function (cb) {
          Promise.resolve().then(cb);
        };
    </script>
    <script>
      if (typeof globalThis === 'undefined') {
        Object.defineProperty(window, 'globalThis', {
          get: function () {
            return window;
          },
        });
      }
    </script>
    <!-- Self-hosted Telegram WebApp bridge — [CONV1] `defer` keeps the splash on the
         parse-critical path while the bridge downloads; executes before the module bundle.
         OMITTED under VITE_E2E=1 so the §11.3 addInitScript mock is not clobbered. -->
    <script src="/miniapp/telegram-web-app.js.js" defer></script>
    <script type="module" crossorigin src="/miniapp/assets/index-Jog1XqEq.js"></script>
    <link rel="modulepreload" crossorigin href="/miniapp/assets/objectSpread2-CNMZnZV-.js">
    <link rel="modulepreload" crossorigin href="/miniapp/assets/web-CiNxUFf_.js">
    <link rel="stylesheet" crossorigin href="/miniapp/assets/index-DjodFDsf.css">
  </head>
  <body>
    <!-- static inline splash markup (~1 KB, §7.1) — paints before the app bundle -->
    <div id="splash">
      <img src="/miniapp/assets/aoyume.svg" alt="آئو یومه" />
    </div>
    <div id="root"></div>
  </body>
</html>
